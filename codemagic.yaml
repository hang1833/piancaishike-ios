workflows:
  ios-release:
    name: PianCaiShiKe iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: AppStoreConnectKey
    environment:
      vars:
        XCODE_PROJECT: "PianCaiShiKe.xcodeproj"
        XCODE_SCHEME: "PianCaiShiKe"
        BUNDLE_ID: "com.piancaishike.ios"
    scripts:
      - name: Initialize keychain & auto-create signing files
        script: |
          keychain initialize
          openssl genrsa -out /tmp/cert_key.pem 2048
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@file:/tmp/cert_key.pem
          keychain add-certificates
      - name: Organize project folder structure
        script: |
          mkdir -p PianCaiShiKe/Resources PianCaiShiKe/Assets.xcassets/AppIcon.appiconset PianCaiShiKe/Assets.xcassets/AccentColor.colorset
          mv PianCaiShiKeApp.swift StoreManager.swift WebViewContainer.swift Info.plist PianCaiShiKe/
          mv index.html PianCaiShiKe/Resources/
          mv AppIcon-1024.png PianCaiShiKe/Assets.xcassets/AppIcon.appiconset/
          cat << 'EOF' > PianCaiShiKe/Assets.xcassets/Contents.json
          {"info":{"author":"xcode","version":1}}
          EOF
          cat << 'EOF' > PianCaiShiKe/Assets.xcassets/AppIcon.appiconset/Contents.json
          {"images":[{"filename":"AppIcon-1024.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}
          EOF
          cat << 'EOF' > PianCaiShiKe/Assets.xcassets/AccentColor.colorset/Contents.json
          {"colors":[{"color":{"color-space":"srgb","components":{"alpha":"1.000","blue":"0.212","green":"0.569","red":"0.741"}},"idiom":"universal"}],"info":{"author":"xcode","version":1}}
          EOF
      - name: Generate Xcode Project with XcodeGen
        script: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
